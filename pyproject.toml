[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gitscout"
version = "0.2.0"
description = "Find the people who star, fork, file issues or open PRs on GitHub repos, and discover their public emails. GraphQL-first, cron-ready. Proprietary - see LICENSE."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# PEP 639: a "License ::" classifier cannot be combined with `license` as an
# expression, so the proprietary terms are declared above and in LICENSE instead.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gitscout = "gitscout.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gitscout = ["profiles/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:gitscout.*"]
