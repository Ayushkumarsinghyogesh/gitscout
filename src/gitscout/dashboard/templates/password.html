{% extends "base.html" %}
{% block title %}Password{% endblock %}
{% block content %}
<h1>{{ "Choose your password" if first else "Change password" }}</h1>
<div class="card narrow">
<form method="post" action="/account/password" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>New password <input type="password" name="password" minlength="12" required autocomplete="new-password"></label>
  <label>Again <input type="password" name="confirm" minlength="12" required autocomplete="new-password"></label>
  <p class="muted small">At least 12 characters.</p>
  <button class="primary">Save password</button>
</form>
</div>
{% endblock %}
